name: DevDisk
options:
  bundleIdPrefix: com.tsitser
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  DevDisk:
    type: application
    platform: macOS
    sources:
      - path: DevDisk
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsitser.devdisk
        PRODUCT_NAME: DevDisk
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2026081122"
        DEVELOPMENT_TEAM: XPQN3KYX5Z
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DevDisk
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_ENTITLEMENTS: DevDisk/DevDisk.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - DevDiskTests
  DevDiskTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DevDiskTests
    dependencies:
      - target: DevDisk
